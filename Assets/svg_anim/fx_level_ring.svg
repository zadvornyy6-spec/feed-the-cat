<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: ringexp .9s ease-out forwards; }
    @keyframes ringexp {
      0%   { opacity: .85; transform: scale(.35); }
      100% { opacity: 0; transform: scale(2.1); }
    }
  </style>
  <circle class="ring" cx="60" cy="60" r="34" fill="none" stroke="#ffd86b" stroke-width="5" stroke-linecap="round"/>
</svg>
