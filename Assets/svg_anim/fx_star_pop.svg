<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="1" stop-color="#ffc83d"/>
    </linearGradient>
  </defs>
  <style>
    .star { transform-box: fill-box; transform-origin: center; animation: starspin 1s ease-out forwards; }
    @keyframes starspin {
      0%   { opacity: 0; transform: scale(.2) rotate(-30deg); }
      30%  { opacity: 1; transform: scale(1.25) rotate(8deg); }
      70%  { opacity: 1; transform: scale(1) rotate(0); }
      100% { opacity: 0; transform: scale(.6) rotate(20deg); }
    }
  </style>
  <g class="star">
    <path d="M12 1.6 L14.9 8.4 L22.3 9.1 L16.7 14 L18.4 21.2 L12 17.4 L5.6 21.2 L7.3 14 L1.7 9.1 L9.1 8.4 Z" fill="url(#sg)" stroke="#f0a92a" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="9.5" cy="8.5" r="1.3" fill="#fffbe6" opacity=".85"/>
  </g>
</svg>
